services:
  backend:
    build: .
    ports:
      # Bind to localhost only: import endpoints stay reachable from the VPS
      # for maintenance, but the raw backend is never exposed to the internet.
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/db/cinema.db
      - IMPORT_SCHEDULED_ENABLED=true
      # Daily GSC -> Telegram report. Fill in REAL values on the VPS and
      # uncomment (never commit secrets). GSC_REPORT_CREDENTIALS_JSON must be
      # the service-account key minified to a single line: jq -c . gsc-key.json
      # - GSC_REPORT_ENABLED=true
      # - 'GSC_REPORT_CREDENTIALS_JSON={"type":"service_account",...}'
      # - TELEGRAM_BOT_TOKEN=123456789:AA...
      # - TELEGRAM_CHAT_ID=123456789
    volumes:
      - ./db:/app/db:rw
      - ./logs:/app/logs:rw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    mem_limit: 1g

  # Public reverse proxy: exposes only data endpoints on mikr.us public port 20180.
  caddy:
    image: caddy:2-alpine
    ports:
      - "20180:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
    restart: unless-stopped
